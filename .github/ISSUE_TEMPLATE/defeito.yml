name: Defeito
description: Algo no rustnf não faz o que a documentação ou a norma oficial diz.
title: "Defeito: "
body:
  - type: markdown
    attributes:
      value: |
        Para problema de segurança, não abra issue: use o relato privado (veja o `SECURITY.md`).

        **Não anexe certificado, senha, token, nem XML ou PDF com dado de pessoa ou empresa real.**
  - type: textarea
    id: o_que
    attributes:
      label: O que acontece
      description: O comando ou a chamada, a entrada (com dados fictícios) e a saída.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
      description: Se for regra fiscal, cite a fonte oficial (documento, versão, item ou código da regra).
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do rustnf ou commit
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema operacional
