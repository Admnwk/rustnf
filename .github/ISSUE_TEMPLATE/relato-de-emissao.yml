name: Relato de emissão
description: Você testou emitir, consultar ou cancelar uma NFS-e com o rustnf. Conte como foi, tenha dado certo ou não.
title: "Relato: "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por testar. O projeto ainda não tem nota real emitida, então todo relato ajuda, inclusive o de sucesso.

        **Não anexe certificado, senha, token, nem XML ou PDF com dado de pessoa ou empresa real.** Antes de colar
        qualquer trecho, troque nomes e documentos pelos fictícios de `crates/rustnf/tests/higiene_documentos.txt`.
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Produção restrita
        - Produção
    validations:
      required: true
  - type: dropdown
    id: operacao
    attributes:
      label: O que você fez
      options:
        - Emitir
        - Consultar
        - Cancelar
        - Outro (explique abaixo)
    validations:
      required: true
  - type: dropdown
    id: resultado
    attributes:
      label: Resultado
      options:
        - Deu certo (nota autorizada, consulta ou cancelamento aceito)
        - A Sefin Nacional rejeitou
        - O rustnf recusou antes de enviar
        - Erro de rede, de certificado ou do programa
    validations:
      required: true
  - type: dropdown
    id: assinatura
    attributes:
      label: Assinatura usada
      options:
        - SHA-256 (o padrão)
        - SHA-1 (--assinatura sha1)
        - Não sei
    validations:
      required: true
  - type: input
    id: municipio
    attributes:
      label: Município do prestador (código IBGE de 7 dígitos)
      placeholder: "3550308"
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do rustnf ou commit
      description: A saída de `rustnf --version`, ou o hash do commit.
    validations:
      required: true
  - type: input
    id: regime
    attributes:
      label: Regime do prestador
      description: Não optante, MEI ou ME/EPP do Simples Nacional.
  - type: textarea
    id: retorno
    attributes:
      label: Código e mensagem de retorno
      description: O código (por exemplo E0312) e o texto que a Sefin Nacional ou o rustnf devolveu.
      render: text
  - type: textarea
    id: detalhe
    attributes:
      label: O que você esperava e o que aconteceu
      description: O comando usado (sem a senha), o código de serviço, e o trecho do pedido ou do XML que interessa, já com os dados trocados por fictícios.
    validations:
      required: true
  - type: checkboxes
    id: cuidado
    attributes:
      label: Antes de enviar
      options:
        - label: Não anexei certificado, senha nem token.
          required: true
        - label: Troquei nomes, documentos e endereços reais por fictícios.
          required: true
