name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sem informacao de depuracao: cada binario de teste liga a arvore de dependencias inteira, e com ela o disco do
  # executor enche no meio da ligacao.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatacao
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Testes
        run: cargo test --workspace --all-features
      - name: Higiene (arquivos e historico)
        run: cargo test -p rustnf --test higiene
      - name: Documentacao (aviso vira erro)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
      - name: Exemplo da biblioteca
        run: cargo run -p rustnf --example montar_e_assinar --features cert_a1_teste

  versao-minima:
    # O `rust-version` declarado no Cargo.toml: o workspace tem de compilar nele, nao so' no Rust estavel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.92
      - uses: Swatinem/rust-cache@v2
      - name: Compilar na versao minima
        run: cargo check --workspace --all-targets --all-features

  segredos:
    # Varre o historico inteiro procurando chave, senha ou token. O binario oficial e' conferido pelo SHA-256 da
    # release antes de rodar; a configuracao e' o `.gitleaks.toml` da raiz.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSAO: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Baixar o gitleaks
        run: |
          arquivo="gitleaks_${GITLEAKS_VERSAO}_linux_x64.tar.gz"
          curl -sSfL -o "$arquivo" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSAO}/$arquivo"
          echo "${GITLEAKS_SHA256}  $arquivo" | sha256sum -c -
          tar -xzf "$arquivo" gitleaks
      - name: Gitleaks
        run: ./gitleaks git --no-banner --redact --exit-code 1 --log-opts=--all .

  interface:
    # A interface de desktop so' tem janela no Windows: aqui ela compila com o GPUI de verdade e os testes de janela
    # rodam. No Linux (job `verificar`) so' a camada sem janela e' compilada e testada.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy da interface
        run: cargo clippy -p rustnf-gui --all-targets --all-features -- -D warnings
      - name: Testes da interface
        run: cargo test -p rustnf-gui --all-features
      - name: Icone e versao no executavel da interface
        shell: pwsh
        run: |
          cargo build -p rustnf-gui
          $versao = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'rustnf-gui' | Select-Object -ExpandProperty version
          ./.github/conferir_recursos.ps1 -Exe target/debug/rustnf-gui.exe -Versao $versao

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
