name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sem informacao de depuracao: cada binario de teste liga a arvore de dependencias inteira, e com ela o disco do
  # executor enche no meio da ligacao.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatacao
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Testes
        run: cargo test --workspace --all-features
      - name: Higiene (arquivos e historico)
        run: cargo test -p rustnf --test higiene

  interface:
    # A interface de desktop so' tem janela no Windows: aqui ela compila com o GPUI de verdade e os testes de janela
    # rodam. No Linux (job `verificar`) so' a camada sem janela e' compilada e testada.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy da interface
        run: cargo clippy -p rustnf-gui --all-targets --all-features -- -D warnings
      - name: Testes da interface
        run: cargo test -p rustnf-gui --all-features
      - name: Icone e versao no executavel da interface
        shell: pwsh
        run: |
          cargo build -p rustnf-gui
          $versao = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'rustnf-gui' | Select-Object -ExpandProperty version
          ./.github/conferir_recursos.ps1 -Exe target/debug/rustnf-gui.exe -Versao $versao

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
