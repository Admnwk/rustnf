name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sem informacao de depuracao: cada binario de teste liga o Typst inteiro, e com ela o disco do executor enche
  # no meio da ligacao.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatacao
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Testes
        run: cargo test --workspace --all-features
      - name: Higiene (arquivos e historico)
        run: cargo test -p rustnf --test higiene

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
