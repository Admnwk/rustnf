[advisories]
version = 2
ignore = [
    # chrono sem mantenedor (aviso de manutencao, nao vulnerabilidade): troca para outra biblioteca de datas no ROADMAP.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; migracao planejada no ROADMAP" },
    # Dependencias do GPUI (crate `rustnf-gui`, gpui-kit 0.10.0). Sem mantenedor (nao e' vulnerabilidade), todas
    # transitivas e sem substituto aceito por ele. Rever a cada versao nova do gpui-kit (ROADMAP).
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitiva do GPUI (gpui-component, gpui-base)" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitiva do GPUI (gpui-pre-reqwest)" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; transitiva do GPUI (gpui-component)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; transitiva do GPUI (gpui-component > resvg > usvg)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitiva do GPUI (cosmic-text > fontdb)" },
    # So' no lado Linux do GPUI (acessibilidade e portal por D-Bus), que o rustnf-gui, so' Windows, nao compila.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; so' no lado Linux do GPUI, que nao e' compilado" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; so' no lado Linux do GPUI, que nao e' compilado" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; so' no lado Linux do GPUI, que nao e' compilado" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # enum-iterator (transitiva do GPUI): BSD de zero clausulas, sem nenhuma exigencia
    "0BSD",
    # webpki-roots (raizes de CA do rustls): licenca de DADOS permissiva
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
