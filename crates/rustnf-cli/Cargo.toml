[package]
name = "rustnf-cli"
description = "Binario rustnf: linha de comando, API HTTP e servidor MCP do emissor de NFS-e nacional e de NF-e."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "rustnf_cli"
path = "src/lib.rs"

[[bin]]
name = "rustnf"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe", "danfce"] }
rustnf-app = { path = "../rustnf-app" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "matched-path"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
clap_complete = "4"

[dev-dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe", "danfce", "cert_a1_teste"] }
tower = { version = "0.5", features = ["util"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# so' os testes: o gzip do docZip dos documentos ficticios (a mesma crate que a biblioteca ja usa)
flate2 = "1"
