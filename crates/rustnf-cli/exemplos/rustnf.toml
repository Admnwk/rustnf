# Arquivo de configuracao do rustnf (so' dados ficticios).
#
# Onde ele mora: `--config <arquivo>`, a variavel de ambiente RUSTNF_CONFIG ou o local padrao
# (no Windows %APPDATA%/rustnf/rustnf.toml; nos outros sistemas $XDG_CONFIG_HOME/rustnf/rustnf.toml ou
# $HOME/.config/rustnf/rustnf.toml). `rustnf config caminho` mostra o que vale.
#
# Precedencia de cada parametro: opcao da linha de comando > variavel de ambiente RUSTNF_* > este arquivo > padrao.
# Toda secao e todo campo sao opcionais; campo desconhecido e' recusado.
#
# NAO existe campo de senha nem de token: a senha do certificado fica no cofre do sistema
# (`rustnf senha guardar`) ou vem de --senha-env / --senha-stdin.

# Dados do prestador. Completam o pedido da DPS so' onde o pedido nao traz o campo (nunca sobrescrevem).
[emitente]
cnpj = "11222333000181"          # ou cpf = "..."; so' um dos dois
nome = "OFICINA TESTE"
inscricao_municipal = "123456"
municipio = "3550308"            # codigo IBGE, 7 digitos
op_simples = 3                   # 1 nao optante, 2 MEI, 3 ME/EPP
regime_apuracao = 1              # regime de apuracao do Simples Nacional; 0 = nao informar
regime_especial = 0              # regime especial de tributacao; 0 = nenhum
serie = "1"                      # serie da DPS (ate 5 digitos)
aliquota_iss = ""                # aliquota padrao do ISS (ex. "2.00"); vazio = nao informar. So' para municipio sem
                                 # convenio com o sistema nacional, ou ME/EPP com ISS retido

[sefin]
ambiente = "restrita"            # producao | restrita
pfx = "certificado.pfx"          # caminho do certificado A1; a senha NAO vem para ca
tempo_limite_s = 60              # tempo limite de cada chamada a Sefin Nacional
folga_relogio_s = 60             # segundos tirados do relogio no dhEmi que o pedido nao traz
assinatura = "sha256"            # sha256 | sha1: algoritmo da assinatura da DPS e dos eventos

[notas]
pasta = "notas"                  # vazio = nao guardar; guarda o XML, o indice e a numeracao da DPS

[danfse]
canhoto = true                   # canhoto de cientificacao no rodape

# NF-e (modelo 55). O que ja esta acima vale tambem para ela: o CNPJ ou CPF e o nome do [emitente], o municipio
# ([emitente].municipio), o certificado ([sefin].pfx, com a senha no mesmo cofre), a folga do relogio
# ([sefin].folga_relogio_s) e a pasta de notas ([notas].pasta, onde a NF-e usa a subpasta nfe/). So' o que a NFS-e
# nao tem fica aqui. Variaveis de ambiente: RUSTNF_NFE_AMBIENTE, RUSTNF_NFE_SERIE, RUSTNF_NFE_CONTINGENCIA e
# RUSTNF_NFE_TEMPO_LIMITE.
[nfe]
ambiente = "homologacao"         # homologacao (padrao) | producao: a NF-e de homologacao nao vale
uf = "SP"                        # UF do emitente: escolhe o autorizador da SEFAZ
ie = "111111111111"              # inscricao estadual, so' digitos
crt = 1                          # 1 Simples Nacional, 2 Simples com excesso de sublimite, 3 regime normal, 4 MEI
regime_pis_cofins = ""           # cumulativo | nao_cumulativo (CRT 3); vazio = sem o aviso de CST que nao combina
serie = "1"                      # serie da NF-e, de 0 a 999
contingencia = "normal"          # normal | svc (SEFAZ Virtual de Contingencia; exige o motivo abaixo)
motivo_contingencia = ""         # de 15 a 255 caracteres, so' com contingencia = "svc"
fantasia = "OFICINA TESTE"
tempo_limite_s = 60              # tempo limite de cada chamada a SEFAZ
tentativas_retorno = 5           # consultas do recibo de um lote que segue em processamento
intervalo_retorno_s = 3          # espera entre elas (a SEFAZ rejeita consulta em rajada)
canhoto = true                   # canhoto de recebimento no DANFE
ca_pem = ""                      # raiz de confianca a mais (arquivo PEM): so' para simulador ou homologacao propria
# [nfe.urls]                     # enderecos que trocam os da tabela oficial (simulador local): status, autorizacao,
# autorizacao = "http://127.0.0.1:4050/NFeAutorizacao4/NFeAutorizacao4.asmx"   # retorno, consulta, eventos, inutilizacao

[nfe.endereco]                   # o endereco do emitente na NF-e (o municipio vem de [emitente].municipio)
logradouro = "Rua das Flores"
numero = "100"
complemento = ""
bairro = "Centro"
cod_municipio = ""               # vazio = [emitente].municipio
municipio = "Sao Paulo"
cep = "01001000"
fone = "1133334444"

[servidor]
endereco = "127.0.0.1"
porta = 8080
limite_corpo = 1048576           # bytes
tempo_limite_s = 60
origens_permitidas = []          # por exemplo ["https://app.exemplo.com.br"]

# Preferencias da interface de desktop (`rustnf-gui`); a linha de comando nao as usa.
[interface]
tema = "sistema"                 # sistema (segue o do Windows) | claro | escuro

# Aliquotas publicadas por ano (percentual, texto decimal), usadas pela previa do IBS/CBS (`rustnf calcular`) quando o
# pedido nao traz `publicadas`. 2027-2028: cbs_referencia (a biblioteca tira 0,1 ponto percentual) ou cbs;
# 2029 em diante: cbs, ibs_uf e ibs_mun. Os numeros abaixo sao de exemplo.
[[aliquotas]]
ano = 2027
cbs_referencia = "8.8"
fonte = "exemplo: norma ficticia de aliquotas"
