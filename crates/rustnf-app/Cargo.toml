[package]
name = "rustnf-app"
description = "Camada de aplicacao do rustnf: operacoes, emissao, configuracao, cofre de senhas e pasta de notas, sem tela e sem servidor."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }
