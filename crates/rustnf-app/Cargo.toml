[package]
name = "rustnf-app"
description = "Camada de aplicacao do rustnf: operacoes, emissao, configuracao, cofre de senhas e pasta de notas, sem tela e sem servidor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe", "danfce"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# o relogio da emissao da NF-e (o `dhEmi` e os instantes da pasta de notas); a mesma crate que a biblioteca ja usa
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# o intervalo entre as consultas da atualizacao em lote (so' o relogio; o runtime e' de quem chama)
tokio = { version = "1", default-features = false, features = ["time"] }
toml = "1"
zeroize = "1"
# busca do CEP (so' quando pedida); a mesma versao e as mesmas opcoes que a biblioteca ja usa
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe", "danfce", "cert_a1_teste"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
# so' os testes: o gzip e o base64 do docZip dos documentos ficticios (as mesmas crates que a biblioteca ja usa)
flate2 = "1"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
keyring-core = "1"
windows-native-keyring-store = { version = "1", default-features = false }
