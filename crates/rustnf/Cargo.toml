[package]
name = "rustnf"
description = "Emissor aberto de NFS-e nacional (padrao Sefin Nacional / ADN) com o grupo IBS/CBS da Reforma Tributaria."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Gera certificado A1 autoassinado para teste (sem certificado real). Nao use em producao.
cert_a1_teste = ["dep:x509-cert", "dep:rand"]
# Cliente HTTP da Sefin Nacional (mTLS, reqwest + rustls).
sefin = ["dep:reqwest", "dep:tokio", "dep:async-trait"]
# NF-e modelo 55: leitura do XML, tabela de cStat e calendario das Notas Tecnicas (sem crate nova).
nfe = []
# Cliente dos webservices da SEFAZ para a NF-e modelo 55 (SOAP 1.2, mTLS com o A1, reqwest + rustls): status do
# servico, autorizacao, retorno do recibo e consulta pela chave. Sem crate nova alem das do `sefin`.
nfe_sefaz = ["nfe", "dep:reqwest", "dep:tokio", "dep:async-trait"]
# DANFSe em PDF (NT 008): escreve a pagina direto no PDF; as fontes e o logotipo vao dentro do binario.
danfse = ["dep:krilla", "dep:skrifa", "dep:qrcode"]
# DANFE da NF-e modelo 55 em PDF (MOC 7.00, Anexo II): desenhado com o escritor do DANFSe, sem crate nova.
danfe = ["nfe", "danfse"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.21"
base64 = "0.22"
flate2 = "1"
unicode-normalization = "0.1"
sha1 = { version = "0.11", features = ["oid"] }
sha2 = { version = "0.11", features = ["oid"] }
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-parser = "0.18"
p12-keystore = "0.3.2"
# zera da memoria o PEM da chave privada quando o buffer e' solto
zeroize = "1"
getrandom = { version = "0.4", features = ["sys_rng"] }
x509-cert = { version = "0.3", features = ["builder"], optional = true }
rand = { version = "0.10", optional = true }
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["time", "net", "io-util", "sync"], optional = true }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"], optional = true }
skrifa = { version = "0.42.1", optional = true }
qrcode = { version = "0.15", default-features = false, optional = true }

[dev-dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rustnf = { path = ".", features = ["cert_a1_teste", "sefin", "danfse", "danfe", "nfe", "nfe_sefaz"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }

[[example]]
name = "montar_e_assinar"
required-features = ["cert_a1_teste"]

[[example]]
name = "danfe"
required-features = ["danfe"]

