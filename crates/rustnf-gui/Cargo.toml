[package]
name = "rustnf-gui"
description = "Interface de desktop do rustnf (GPUI): configuracao, certificado e primeiro uso. Somente Windows nesta versao."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "rustnf-gui"
path = "src/main.rs"

[features]
# O emissor de demonstracao (sem rede) e o exemplo `demonstracao`. Desligada por padrao: o executavel normal nao tem
# como entrar nesse modo. Liga o certificado de teste da biblioteca: a demonstracao da NF-e assina as notas do ensaio.
demonstracao = ["rustnf/cert_a1_teste", "dep:flate2", "dep:base64"]

[[example]]
name = "demonstracao"
path = "examples/demonstracao.rs"
required-features = ["demonstracao"]

[build-dependencies]
# Icone e versao no executavel do Windows (o mesmo crate que o GPUI usa para o manifesto dele).
embed-resource = "3"

[dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe"] }
rustnf-app = { path = "../rustnf-app" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net", "sync"] }
# so' a demonstracao e os testes: o gzip e o base64 do docZip dos documentos ficticios da distribuicao (as mesmas crates e
# versoes que a biblioteca ja usa; nenhuma crate nova na arvore)
flate2 = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[target.'cfg(windows)'.dependencies]
gpui-kit = "=0.11.0"

[dev-dependencies]
rustnf = { path = "../rustnf", features = ["sefin", "danfse", "nfe_sefaz", "danfe", "cert_a1_teste"] }
flate2 = "1"
base64 = "0.23"

[target.'cfg(windows)'.dev-dependencies]
gpui-kit = { version = "=0.11.0", features = ["test-support"] }
