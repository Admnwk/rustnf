[workspace]
resolver = "2"
members = ["crates/rustnf", "crates/rustnf-app", "crates/rustnf-cli", "crates/rustnf-gui"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.92"
license = "MPL-2.0"
authors = ["Os autores do rustnf"]
repository = "https://github.com/Admnwk/rustnf"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# As dependencias compilam sem informacao de depuracao: a arvore e' grande (GPUI) e, com ela, a pasta de
# build passa de 15 GB e a ligacao dos binarios fica lenta. O codigo do proprio workspace continua depuravel.
[profile.dev.package."*"]
debug = false
